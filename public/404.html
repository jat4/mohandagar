<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runner Stopwatch - Redirecting</title>
    <script>
      // Single Page Apps for GitHub Pages & static web servers
      // Store current path and redirect to index.html with query/path
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path.startsWith('/') ? path.substring(1) : path) + search + hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/home">Runner Stopwatch</a>...</p>
  </body>
</html>
